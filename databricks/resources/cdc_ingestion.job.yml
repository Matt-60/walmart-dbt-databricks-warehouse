resources:
  jobs:
    walmart_cdc_ingestion:
      name: Walmart CDC ingestion (source → bronze)
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: setup_source          # idempotent — no-op once the source exists
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00_setup_source.py

        - task_key: generate_changes
          depends_on:
            - task_key: setup_source
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_generate_changes.py
            base_parameters:
              new_orders: "50"
              new_customers: "3"

        - task_key: bronze_cdc            # Lakeflow pipeline: CDF → AUTO CDC → bronze streaming tables
          depends_on:
            - task_key: generate_changes
          pipeline_task:
            pipeline_id: ${resources.pipelines.walmart_bronze_cdc.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
