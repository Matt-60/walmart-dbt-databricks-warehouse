models:
  - name: silver_customers
    description: "One row per customer (current state from Bronze). Trimmed text, lower-cased email, digits-only phone."
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: customer_email
        data_tests: [not_null]
      - name: customer_is_active
        data_tests: [not_null]
      - name: customer_updated_at
        description: "Used by customers_snapshot (timestamp strategy)."
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: silver_employees
    description: "One row per employee (current state from Bronze)."
    columns:
      - name: employee_id
        data_tests: [not_null, unique]
      - name: store_id
        data_tests:
          - relationships:
              arguments: {to: ref('silver_stores'), field: store_id}
      - name: employee_salary
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
      - name: employee_is_active
        data_tests: [not_null]

  - name: silver_products
    description: "One row per product (current state from Bronze)."
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: product_price
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
      - name: product_category
        data_tests:
          - accepted_values:
              arguments:
                values: [Home, Sports, Electronics, Toys, Clothing, Grocery]
      - name: product_brand
        data_tests:
          - accepted_values:
              arguments:
                values: [Samsung, Adidas, Nestle, Nike, LG, Apple, Sony]
      - name: product_is_active
        data_tests: [not_null]

  - name: silver_stores
    description: "One row per store (current state from Bronze)."
    columns:
      - name: store_id
        data_tests: [not_null, unique]
      - name: store_is_active
        data_tests: [not_null]

  - name: silver_orders
    description: "One row per order. Incremental (MERGE on order_id) with a 3-day lookback window; supports date-range backfill via vars."
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('silver_customers'), field: customer_id}
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('silver_stores'), field: store_id}
      - name: order_date
        data_tests: [not_null]
      - name: order_payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: [Cash, Debit Card, Credit Card, Gift Card, Online]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [Pending, Cancelled, Returned, Completed]
      - name: order_total_amount
        description: "Must equal the sum of line amounts (tests/assert_order_total_equals_line_items.sql)."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
      - name: order_is_active
        data_tests: [not_null]
      - name: order_created_at
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: order_updated_at
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: silver_order_items
    description: "One row per order line. Incremental (MERGE on order_item_id) with a 3-day lookback window."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_item_line_amount = order_item_quantity * order_item_unit_price"
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('silver_orders'), field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('silver_products'), field: product_id}
      - name: order_item_quantity
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
      - name: order_item_unit_price
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
      - name: order_item_is_active
        data_tests: [not_null]
      - name: order_item_created_at
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: order_item_updated_at
        data_tests:
          - not_null:
              config: {severity: warn}
